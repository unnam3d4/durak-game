name: Milestone C CI

on:
  push:
    branches:
      - feature/milestone-c-perevodnoy
      - feature/product-shell
  pull_request:
    branches:
      - feature/milestone-c-perevodnoy
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
