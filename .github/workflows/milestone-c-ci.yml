name: Milestone C CI

on:
  push:
    branches:
      - feature/milestone-c-perevodnoy
      - stabilize/milestone-c
      - feature/release-ranked-pve
  pull_request:
    branches:
      - feature/milestone-c-perevodnoy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock release dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify release artwork
        run: npm run verify:release-art
      - name: Verify Yandex archive
        run: node scripts/verify-yandex-build.mjs
      - name: Upload Yandex build
        uses: actions/upload-artifact@v7
        with:
          name: durak-yandex-build
          path: dist/
          if-no-files-found: error
