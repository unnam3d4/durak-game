name: Milestone C CI

on:
  push:
    branches:
      - feature/milestone-c-perevodnoy
      - stabilize/milestone-c
      - feature/release-ranked-pve
  pull_request:
    branches:
      - feature/milestone-c-perevodnoy
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify release artwork
        run: npm run verify:release-art
      - name: Verify Yandex archive
        run: node scripts/verify-yandex-build.mjs
      - name: Upload Yandex build
        uses: actions/upload-artifact@v4
        with:
          name: durak-yandex-build
          path: dist/
          if-no-files-found: error
